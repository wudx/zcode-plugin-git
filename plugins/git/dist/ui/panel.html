<!doctype html>
<!-- 面板 DOM 骨架源文件：构建时由 build.mjs 内联 panel.css 与 main.js bundle。
     占位符用注释形式（style/script 内均合法），构建后整体写入 dist/ui/panel.html。 -->
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Git</title>
<style>
:root {
  /* MCP Apps design tokens when the host provides them; self-contained fallbacks otherwise. */
  --git-bg: var(--color-background-primary, #17171a);
  --git-bg-soft: var(--color-background-secondary, #1f1f23);
  --git-fg: var(--color-text-primary, #e4e4e7);
  --git-fg-dim: var(--color-text-secondary, #9d9da7);
  --git-border: var(--color-border-secondary, #2c2c33);
  --git-accent: var(--color-ring-primary, #4f8ef7);
  --git-add: #3fb968;
  --git-del: #f2555a;
  --git-mod: #d29922;
  --git-ren: #58a6ff;
  --git-new: #8b949e;
  --git-conf: #f85149;
  --mono: ui-monospace, "Cascadia Mono", Consolas, "Courier New", monospace;
}
html, body {
  margin: 0;
  height: 100%;
}
body {
  display: flex;
  flex-direction: column;
  background: var(--git-bg);
  color: var(--git-fg);
  font: 12px/1.5 system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
  overflow: hidden;
}
[data-theme="light"] {
  --git-bg: #ffffff;
  --syn-kw: #cf222e;
  --syn-str: #0a3069;
  --syn-com: #6e7781;
  --syn-num: #0550ae;
  --syn-fn: #8250df;
  --syn-type: #953800;
}
/* diff 语法高亮 token 色（GitHub 深浅两套；浅色覆盖见 [data-theme="light"]） */
body {
  --syn-kw: #ff7b72;
  --syn-str: #a5d6ff;
  --syn-com: #8b949e;
  --syn-num: #79c0ff;
  --syn-fn: #d2a8ff;
  --syn-type: #ffa657;
}
.tk-kw { color: var(--syn-kw); }
.tk-str { color: var(--syn-str); }
.tk-com { color: var(--syn-com); }
.tk-num { color: var(--syn-num); }
.tk-fn { color: var(--syn-fn); }
.tk-type { color: var(--syn-type); }

#fatal {
  margin: 12px;
  padding: 10px 12px;
  border: 1px solid #f8514955;
  background: #f8514918;
  color: var(--git-fg);
  border-radius: 8px;
  white-space: pre-wrap;
  word-break: break-all;
}

/* header */
#header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  border-bottom: 1px solid var(--git-border);
  flex: none;
  /* 存储下拉菜单的定位基准 */
  position: relative;
}
#branch {
  font-weight: 600;
  font-size: 12px;
  display: flex;
  align-items: center;
  gap: 5px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
#branch::before {
  content: "";
  width: 12px;
  height: 12px;
  flex: none;
  background: currentColor;
  -webkit-mask: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><circle cx="4" cy="3" r="2"/><circle cx="4" cy="13" r="2"/><circle cx="12" cy="8" r="2"/><path d="M4 5v6M6 3h2a4 4 0 0 1 4 4v0" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>') center/contain no-repeat;
          mask: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><circle cx="4" cy="3" r="2"/><circle cx="4" cy="13" r="2"/><circle cx="12" cy="8" r="2"/><path d="M4 5v6M6 3h2a4 4 0 0 1 4 4v0" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>') center/contain no-repeat;
}
#ahead-behind {
  font-size: 11px;
  flex: none;
}
#ahead-behind .ab-ahead { color: var(--git-add); }
#ahead-behind .ab-behind { color: var(--git-mod); }
#header .spacer { flex: 1; }

/* buttons */
.btn {
  border: 1px solid var(--git-border);
  background: var(--git-bg-soft);
  color: var(--git-fg);
  border-radius: 6px;
  font: inherit;
  font-size: 11px;
  padding: 2px 8px;
  cursor: pointer;
  white-space: nowrap;
}
.btn:hover { border-color: var(--git-accent); }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn.primary { color: var(--git-accent); }
.btn.danger { color: inherit; opacity: 0.75; }
.btn.danger:hover { color: var(--git-del); border-color: var(--git-del); }
.btn.icon { padding: 3px 6px; line-height: 0; }
.btn.icon svg { display: block; }
.btn.active { border-color: var(--git-accent); color: var(--git-accent); }
.flex1 { flex: 1; }
#header .btn.icon { position: relative; }

/* sections */
#scroll {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding-bottom: 8px;
}
.section-h {
  padding: 10px 12px 4px;
  font-size: 11px;
  font-weight: 600;
  color: var(--git-fg-dim);
  text-transform: none;
  position: sticky;
  top: 0;
  background: var(--git-bg);
  z-index: 1;
  display: flex;
  align-items: center;
  gap: 4px;
  cursor: pointer;
  user-select: none;
}
.section-h:focus-visible { outline: 1px solid var(--git-accent); outline-offset: -1px; }
/* 分区头 chevron：比树目录行的大一号，点击目标更明显 */
.section-h .chev { font-size: 12px; width: 12px; text-align: center; }
/* 分区批量操作：悬停/聚焦分区标题时浮现 */
.sec-actions { display: inline-flex; gap: 4px; opacity: 0; transition: opacity 0.15s; }
.section-h:hover .sec-actions,
.section-h:focus-within .sec-actions { opacity: 1; }
#clean, .section-empty {
  padding: 14px 12px;
  color: var(--git-fg-dim);
}
#clean { color: var(--git-add); }

/* conflict banner */
#conflict-box {
  margin: 8px 12px 0;
  border: 1px solid #f8514966;
  border-radius: 8px;
  overflow: hidden;
}
#conflict-title {
  padding: 6px 10px;
  background: #f8514922;
  color: var(--git-conf);
  font-weight: 600;
  font-size: 11px;
}
#conflict-box .row { background: #f851490d; }

/* file rows */
.row {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 3px 12px;
  cursor: pointer;
}
.row:hover { background: var(--git-bg-soft); }
.row.expanded { background: var(--git-bg-soft); }
.row-main {
  display: flex;
  align-items: center;
  gap: 7px;
  flex: 1;
  min-width: 0;
}
.badge {
  flex: none;
  width: 17px;
  height: 17px;
  border-radius: 4px;
  font: 700 10px/17px var(--mono);
  text-align: center;
}
.b-add { background: #3fb96822; color: var(--git-add); }
.b-mod { background: #d2992222; color: var(--git-mod); }
.b-del { background: #f2555a22; color: var(--git-del); }
.b-ren { background: #58a6ff22; color: var(--git-ren); }
.b-new { background: #8b949e22; color: var(--git-new); }
.b-conf { background: #f8514933; color: var(--git-conf); }
.path {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  direction: rtl;
  text-align: left;
  unicode-bidi: plaintext;
}
.row-btns {
  display: flex;
  gap: 4px;
  flex: none;
  /* 行内操作默认隐藏，悬停/聚焦该行时浮现 */
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.15s;
}
.row:hover .row-btns,
.row:focus-within .row-btns { opacity: 1; pointer-events: auto; }
.confirm-q { font-size: 11px; color: var(--git-del); white-space: nowrap; }

/* diff */
.diff-box {
  position: relative;
  margin: 2px 12px 8px 35px;
  border: 1px solid var(--git-border);
  border-radius: 8px;
  background: var(--git-bg-soft);
  overflow: hidden;
}
.diff-loading { padding: 8px 10px; color: var(--git-fg-dim); }
/* diff 上下文范围切换按钮（±10 行 / ±20 行 / 整个文件） */
.btn.scope { font-size: 10px; padding: 1px 6px; color: var(--git-fg-dim); }
.btn.scope:hover { color: var(--git-fg); }

/* 图片比对视图：旧版 | 新版 */
.imgcmp {
  display: flex;
  gap: 10px;
  padding: 8px 10px;
  overflow-x: auto;
}
.imgcmp figure {
  margin: 0;
  flex: 1 1 0;
  min-width: 130px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.imgcmp figcaption { font-size: 10.5px; color: var(--git-fg-dim); }
.imgcmp img {
  max-width: 100%;
  max-height: 220px;
  object-fit: contain;
  border: 1px solid var(--git-border);
  border-radius: 4px;
  /* 透明底棋盘格 */
  background-image: conic-gradient(#2a2a30 0 25%, #38383f 0 50%, #2a2a30 0 75%, #38383f 0);
  background-size: 16px 16px;
}
.img-err { font-size: 11px; color: var(--git-fg-dim); overflow-wrap: anywhere; }
.diff {
  margin: 0;
  padding: 6px 0;
  max-height: max(320px, 45vh);
  overflow: auto;
  font: 11px/1.55 var(--mono);
  white-space: pre;
  tab-size: 4;
}
/* 统一视图行号沟槽：::before 渲染 data-ln，行元素 textContent 保持纯代码；
   只给带行号的行渲染（hunk/文件头不再空出沟槽），sticky 钉住横向滚动，
   铺成所在行的实际底色遮挡滑过的代码，min-width 容纳更长行号 */
.diff > span[data-ln]::before {
  content: attr(data-ln);
  display: inline-block;
  position: sticky;
  left: 0;
  min-width: 3em;
  padding: 0 6px;
  text-align: right;
  color: var(--git-fg-dim);
  background: var(--git-bg-soft);
  user-select: none;
}
.diff > .dl-add[data-ln]::before { background: linear-gradient(#3fb96826, #3fb96826), var(--git-bg-soft); }
.diff > .dl-del[data-ln]::before { background: linear-gradient(#f2555a26, #f2555a26), var(--git-bg-soft); }
.dl-ctx { display: block; color: var(--git-fg); padding: 0 8px; }
.dl-add { display: block; background: #3fb96826; color: var(--git-fg); padding: 0 8px; }
.dl-del { display: block; background: #f2555a26; color: var(--git-fg); padding: 0 8px; }
.dl-hunk { display: block; color: var(--git-ren); padding: 0 8px; }
.dl-meta { display: block; color: var(--git-fg-dim); padding: 0 8px; }

/* commit bar */
#commit-bar {
  flex: none;
  position: relative;
  border-top: 1px solid var(--git-border);
  padding: 8px 12px 10px;
  background: var(--git-bg);
}
/* 顶边拖拽手柄：拖动调整底部区域高度，悬停/拖拽中亮起；双击恢复默认 */
#bar-resizer {
  position: absolute;
  left: 0;
  right: 0;
  top: -4px;
  height: 8px;
  cursor: ns-resize;
  touch-action: none;
  z-index: 5;
}
#bar-resizer::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: 3px;
  height: 2px;
  background: transparent;
}
#bar-resizer:hover::after,
#bar-resizer:focus-visible::after,
#bar-resizer.drag::after { background: var(--git-accent); }
#commit-msg {
  width: 100%;
  box-sizing: border-box;
  resize: none;
  height: 56px;
  border: 1px solid var(--git-border);
  border-radius: 8px;
  background: var(--git-bg-soft);
  color: var(--git-fg);
  font: inherit;
  padding: 6px 8px;
}
#commit-msg:focus { outline: none; border-color: var(--git-accent); }
#commit-actions {
  display: flex;
  gap: 8px;
  margin-top: 8px;
  align-items: center;
}
#ai-btn { color: var(--git-accent); }
#commit-btn {
  margin-left: auto;
  background: var(--git-accent);
  border-color: var(--git-accent);
  color: #fff;
  font-weight: 600;
  padding: 4px 14px;
}
#commit-btn:not(:disabled):hover { filter: brightness(1.1); }

/* toast */
#toast {
  position: fixed;
  left: 50%;
  bottom: 96px;
  transform: translateX(-50%) translateY(8px);
  max-width: 90%;
  background: #33333b;
  color: #fff;
  border-radius: 8px;
  padding: 7px 14px;
  font-size: 11px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.18s, transform 0.18s;
  z-index: 40;
  word-break: break-all;
  display: flex;
  align-items: flex-start;
  gap: 6px;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
#toast.err { background: #6e282c; }
.toast-text { flex: 1; min-width: 0; }
.toast-x {
  flex: none;
  border: 0;
  background: none;
  color: inherit;
  cursor: pointer;
  font-size: 13px;
  line-height: 1;
  padding: 0 2px;
  opacity: 0.7;
}
.toast-x:hover { opacity: 1; }

/* stash dropdown menu */
#stash-menu {
  position: absolute;
  top: calc(100% + 4px);
  right: 10px;
  z-index: 30;
  min-width: 250px;
  max-width: calc(100% - 20px);
  background: var(--git-bg-soft);
  border: 1px solid var(--git-border);
  border-radius: 8px;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
  padding: 4px;
  display: flex;
  flex-direction: column;
  gap: 1px;
}
#stash-menu[hidden] { display: none; }
.menu-item {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  width: 100%;
  border: none;
  background: none;
  color: inherit;
  font: inherit;
  font-size: 12px;
  text-align: left;
  padding: 6px 8px;
  border-radius: 6px;
  cursor: pointer;
}
.menu-item:hover:not(:disabled) { background: var(--git-bg); }
.menu-item:disabled { opacity: 0.5; cursor: default; }
.menu-ic { display: inline-flex; line-height: 0; }
.menu-sep { height: 1px; background: var(--git-border); margin: 4px 2px; }
.menu-title { font-size: 11px; color: var(--git-fg-dim); padding: 4px 8px 2px; }
.menu-err { font-size: 11px; color: var(--git-del); padding: 4px 8px; overflow-wrap: anywhere; }
.menu-entries { max-height: 200px; overflow-y: auto; display: flex; flex-direction: column; gap: 1px; }
.menu-entry { display: flex; align-items: center; gap: 6px; padding: 3px 6px; border-radius: 6px; }
.menu-entry:hover { background: var(--git-bg); }
.menu-entry-msg {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 11.5px;
}
#stash-btn { margin-right: 3px; }

/* tree view */
.tree { display: flex; flex-direction: column; gap: 1px; }
.tree-dir {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 3px 6px;
  border-radius: 6px;
  cursor: pointer;
  user-select: none;
  font-weight: 600;
  font-size: 11.5px;
}
.tree-dir:hover { background: var(--git-bg-soft); }
.chev { flex: none; font-size: 9px; color: var(--git-fg-dim); transition: transform 0.15s ease; }
.chev.collapsed { transform: rotate(-90deg); }
.tree-dir-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* diff toolbar + split view */
.diff-bar {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 2px;
  padding: 3px 4px;
  border-bottom: 1px solid var(--git-border);
}
.diff-bar .btn.icon { border: none; background: none; color: var(--git-fg-dim); }
.diff-bar .btn.icon:hover { color: var(--git-fg); }
.split-scroll { flex: 1; overflow: auto; max-height: max(320px, 45vh); }
.split-grid {
  display: grid;
  grid-template-columns: minmax(3em, max-content) minmax(14em, max-content) minmax(3em, max-content) minmax(14em, max-content);
  width: max-content;
  min-width: 100%;
  font: 11px/1.55 var(--mono);
  white-space: pre;
  tab-size: 4;
}
.split-grid > span { padding: 0 4px; }
.cell-num { color: var(--git-fg-dim); text-align: right; user-select: none; }
.cell-num.num-r { border-left: 1px solid var(--git-border); }
.cell-code { color: var(--git-fg); }
.cell-del { background: #f2555a26; color: var(--git-fg); }
.cell-add { background: #3fb96826; color: var(--git-fg); }
.cell-span { grid-column: 1 / -1; white-space: pre; padding: 0 8px; }

/* diff 迷你地图（仿 VS Code）：右侧缩略行条 + 视口指示块 */
.minimap {
  position: absolute;
  right: 3px;
  width: 40px;
  cursor: pointer;
  z-index: 2;
  border-radius: 3px;
}
.minimap:hover { background: rgba(127, 127, 127, 0.08); }
.minimap-view {
  position: absolute;
  left: 0;
  right: 0;
  background: rgba(127, 127, 127, 0.18);
  border: 1px solid rgba(127, 127, 127, 0.35);
  border-radius: 2px;
  pointer-events: none;
}

/* custom AI prompt */
#prompt-area {
  width: 100%;
  box-sizing: border-box;
  height: 48px;
  min-height: 48px;
  resize: vertical;
  margin-top: 8px;
  border: 1px dashed var(--git-border);
  border-radius: 8px;
  background: var(--git-bg-soft);
  color: var(--git-fg);
  font: inherit;
  font-size: 11px;
  padding: 5px 8px;
}
#prompt-area:focus { outline: none; border-color: var(--git-accent); border-style: solid; }

</style>
</head>
<body>
<div id="fatal" hidden></div>
<div id="header">
  <span id="branch"></span>
  <span id="ahead-behind" hidden></span>
  <span class="spacer"></span>
  <button id="view-btn" class="btn icon"></button>
  <button id="pull-btn" class="btn icon"></button>
  <button id="push-btn" class="btn icon"></button>
  <button id="stash-btn" class="btn icon"><span id="stash-btn-icon"></span></button>
  <div id="stash-menu" hidden></div>
</div>
<div id="scroll">
  <div id="conflict-box" hidden>
    <div id="conflict-title"></div>
    <div id="conflict-list"></div>
  </div>
  <div class="section-h" id="staged-h" role="button" tabindex="0" aria-expanded="true"><span id="staged-chev" class="chev">▾</span><span id="staged-title"></span>&nbsp;<span id="staged-count"></span><span class="flex1"></span><span id="staged-all" class="sec-actions"></span></div>
  <div id="staged-list"></div>
  <div id="staged-empty" class="section-empty" hidden></div>
  <div class="section-h" id="worktree-h" role="button" tabindex="0" aria-expanded="true"><span id="worktree-chev" class="chev">▾</span><span id="worktree-title"></span>&nbsp;<span id="worktree-count"></span><span class="flex1"></span><span id="worktree-all" class="sec-actions"></span></div>
  <div id="worktree-list"></div>
  <div id="worktree-empty" class="section-empty" hidden></div>
  <div id="clean" hidden></div>
</div>
<div id="commit-bar">
  <div id="bar-resizer" tabindex="0" role="separator" aria-orientation="horizontal"></div>
  <textarea id="commit-msg" spellcheck="false"></textarea>
  <div id="commit-actions">
    <button id="ai-btn" class="btn"></button>
    <button id="prompt-btn" class="btn icon"></button>
    <button id="commit-btn" class="btn" disabled></button>
  </div>
  <textarea id="prompt-area" spellcheck="false" maxlength="2000" hidden></textarea>
</div>
